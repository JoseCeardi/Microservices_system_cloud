spring:
  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
      routes:
        # CUSTOMER
        - id: ms-customer-sub
          uri: lb://MS-CUSTOMER
          predicates:
            - Path=/api/customers/**

        # KARDEX
        - id: ms-kardex-route
          uri: lb://MS-KARDEX
          predicates:
            - Path=/api/kardex/**



