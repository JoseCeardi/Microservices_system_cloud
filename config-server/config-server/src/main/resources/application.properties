server.port=8888
spring.application.name=config-server

# Conexión al repositorio de GitHub
spring.cloud.config.server.git.uri=https://github.com/JoseCeardi/Microservices_system_cloud.git
spring.cloud.config.server.git.username=JoseCeardi

# Ir a buscar sus configuraciones al github (carpeta config-data)
spring.cloud.config.server.git.search-paths=config-data


# Configuración de Eureka
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.client.serviceUrl.defaultZone=http://localhost:8761/eureka/
